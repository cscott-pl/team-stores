name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · lint:css · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # reference/ is large. Only the tip is needed to verify a PR.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Exact pins + committed lockfile, so CI installs the same tree the repo
      # was developed against. `npm ci` fails if package.json and the lockfile
      # have drifted, which is the point.
      - name: Install
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Lint (stylelint)
        run: npm run lint:css

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
